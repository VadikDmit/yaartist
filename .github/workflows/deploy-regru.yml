# Выкладка сайта на хостинг Рег.ру по FTP при каждом push в main.
#
# Секреты (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER   — адрес FTP-сервера хостинга (например, 31.31.197.119)
#   FTP_USERNAME — FTP-логин (обычно вида u1234567)
#   FTP_PASSWORD — FTP-пароль
#   FTP_DIR      — папка сайта на хостинге, с «/» на конце (например, www/yaartist.com/)
#
# Пока секреты не заданы, выкладка пропускается и сборка не падает.

name: Deploy to Reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-regru
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' && secrets.FTP_DIR != '' }}
    steps:
      - name: Секреты FTP не заданы — пропускаем выкладку
        if: env.HAS_FTP != 'true'
        run: echo "FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / FTP_DIR не заданы — выкладка на Рег.ру пропущена."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - name: Выкладка по FTP (только изменённые файлы)
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            api/**
            package.json
            package-lock.json
            .vercelignore
            **/.DS_Store
